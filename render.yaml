services:
  - type: web
    name: veritasrag-api
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false

  - type: web
    name: veritasrag-ai
    env: docker
    dockerfilePath: ./ai_service/Dockerfile
    dockerContext: ./ai_service
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
